<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Napier Museum — Digital Exhibit</title>
<meta name="description" content="Digital exhibit page — Napier Museum, Thiruvananthapuram.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Tamil:wght@400;500;600&family=Noto+Sans+Malayalam:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap');

  :root{
    --bg:#100E0C; --bg-2:#17140F; --stone:#231F19;
    --stone-line: rgba(217,188,133,0.16);
    --gold:#B08D57; --gold-light:#D9BC85;
    --ink:#EDE7DC; --ink-dim:#A79C89; --ink-faint:#6E6552;
  }
  *{margin:0; padding:0; box-sizing:border-box;}
  html{ scroll-behavior:smooth; width:100%; overflow-x:hidden; }
  body{
    background: var(--bg); color: var(--ink);
    font-family:'IBM Plex Sans','Noto Sans Tamil','Noto Sans Malayalam','Noto Sans Devanagari', sans-serif;
    line-height:1.65; width:100%; max-width:100vw; overflow-x:hidden;
    -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  img{ -webkit-user-drag:none; user-drag:none; pointer-events:none; }
  ::selection{ background:transparent; } ::-moz-selection{ background:transparent; }
  a{ color:inherit; text-decoration:none; }
  .container{ max-width: 1080px; margin:0 auto; padding: 0 20px; }
  @media (min-width:600px){ .container{ padding: 0 32px; } }

  header.site{
    position: sticky; top:0; z-index: 50;
    background: rgba(16,14,12,0.86); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--stone-line);
  }
  .nav-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 16px; gap: 12px; flex-wrap:wrap;
    max-width:1080px; margin:0 auto;
  }
  @media (min-width:600px){ .nav-inner{ padding: 16px 32px; gap:20px; } }
  .brand{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2px;
    text-transform:uppercase; color: var(--gold-light); white-space:nowrap;
  }
  .brand b{ color: var(--ink); font-weight:600; }
  .lang-switch{ display:flex; gap:4px; border:1px solid var(--stone-line); border-radius:999px; padding:3px; }
  .lang-switch button{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:1px;
    padding: 6px 13px; border-radius:999px; border:none; background:transparent;
    color: var(--ink-faint); cursor:pointer; transition: all .25s ease;
  }
  .lang-switch button.active{ background: var(--gold); color:#100E0C; font-weight:600; }
  .lang-switch button:hover:not(.active){ color: var(--gold-light); }

  .hero{ position:relative; min-height: 92vh; display:flex; align-items:flex-end; overflow:hidden; }
  .hero-bg{
    position:absolute; inset:-6%;
    background:
      radial-gradient(ellipse 60% 55% at 62% 38%, rgba(217,188,133,0.16), transparent 60%),
      linear-gradient(180deg, rgba(16,14,12,0.15) 0%, rgba(16,14,12,0.55) 55%, var(--bg) 96%),
      var(--img-hero) center 30% / cover no-repeat;
    filter: sepia(0.28) saturate(1.05) contrast(1.08) brightness(0.72);
    will-change: transform;
  }
  .hero-content{ position:relative; z-index:2; padding: 0 20px 56px; max-width: 1080px; margin: 0 auto; width:100%; }
  @media (min-width:600px){ .hero-content{ padding: 0 32px 76px; } }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 3.5px; text-transform:uppercase;
    color: var(--gold-light); display:flex; align-items:center; gap:10px; margin-bottom: 22px;
    opacity:0; animation: rise .9s ease .15s forwards;
  }
  .eyebrow::before{ content:""; width:34px; height:1px; background: var(--gold); }
  .hero h1{
    font-family:'Fraunces', serif; font-optical-sizing: auto; font-weight: 500; font-style: italic;
    font-size: clamp(56px, 11vw, 132px); line-height: 0.92; color: var(--ink); letter-spacing: -1px;
    opacity:0; animation: rise 1s ease .3s forwards;
  }
  .hero .sub{
    max-width: 480px; margin-top: 26px; color: var(--ink-dim); font-size: 15.5px;
    opacity:0; animation: rise 1s ease .5s forwards;
  }
  @keyframes rise{ from{ opacity:0; transform: translateY(22px); } to{ opacity:1; transform:translateY(0); } }
  .scroll-cue{
    position:absolute; right:32px; bottom:34px; z-index:2;
    display:flex; flex-direction:column; align-items:center; gap:10px; color: var(--ink-faint);
  }
  .scroll-cue .line{ width:1px; height:46px; background: linear-gradient(var(--gold), transparent); animation: drip 2s ease-in-out infinite; }
  @keyframes drip{ 0%{opacity:0.2;} 50%{opacity:1;} 100%{opacity:0.2;} }
  @media (max-width:700px){ .scroll-cue{ display:none; } }

  .label-strip{ border-top: 1px solid var(--stone-line); border-bottom: 1px solid var(--stone-line); background: var(--bg-2); }
  .label-grid{ display:grid; grid-template-columns: repeat(4, 1fr); max-width:1080px; margin:0 auto; }
  .label-cell{ padding: 18px 16px; border-right: 1px solid var(--stone-line); min-width:0; }
  .label-cell:last-child{ border-right:none; }
  .label-cell .k{ font-family:'IBM Plex Mono', monospace; font-size: 10px; letter-spacing:1.2px; text-transform:uppercase; color: var(--ink-faint); margin-bottom: 6px; }
  .label-cell .v{ font-size: 13.5px; color: var(--ink); font-weight:500; word-break:break-word; }
  @media (min-width:600px){ .label-cell{ padding: 26px 28px; } .label-cell .k{ font-size:10.5px; letter-spacing:1.6px; } .label-cell .v{ font-size:15px; } }
  @media (max-width: 700px){ .label-grid{ grid-template-columns: 1fr 1fr; } .label-cell:nth-child(2){ border-right:none; } }

  section{ padding: 64px 0; }
  @media (min-width:600px){ section{ padding: 100px 0; } }
  .reveal{ opacity:0; transform: translateY(26px); transition: opacity .8s ease, transform .8s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }

  .section-head{ margin-bottom: 42px; max-width: 640px; }
  .section-head .tag{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:2.5px; text-transform:uppercase; color: var(--gold); margin-bottom:14px; display:block; }
  .section-head h2{ font-family:'Fraunces', serif; font-weight:500; font-size: clamp(30px, 4vw, 44px); color: var(--ink); letter-spacing:-0.5px; }

  .audio-panel{
    background: var(--stone); border: 1px solid var(--stone-line); border-radius: 14px;
    padding: 16px 18px; display:flex; align-items:center; gap:14px; max-width: 720px; width:100%;
  }
  @media (min-width:600px){ .audio-panel{ padding: 22px 26px; gap:20px; } }
  .audio-panel .playbtn{
    width:52px; height:52px; border-radius:50%; background: var(--gold); border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#100E0C; font-size:18px;
    flex-shrink:0; transition: transform .25s ease, opacity .25s ease;
  }
  .audio-panel .playbtn:hover{ transform: scale(1.06); }
  .audio-panel .playbtn:disabled{ opacity:0.4; cursor:default; transform:none; }
  .audio-meta{ flex:1; min-width:0; }
  .audio-meta .atitle{ font-size:14px; font-weight:600; color: var(--ink); margin-bottom:2px; }
  .audio-meta .ahint{ font-size:12px; color: var(--ink-faint); }
  .audio-bar{ height:3px; background: var(--stone-line); border-radius:2px; margin-top:10px; overflow:hidden; }
  .audio-bar .fill{ height:100%; width:0%; background: var(--gold-light); transition: width .15s linear; }
  .audio-note{ margin-top:14px; font-size:12.5px; color: var(--ink-faint); display:flex; align-items:center; gap:8px; }
  .speed-row{ margin-top:14px; display:flex; align-items:center; gap:10px; }
  .speed-row span{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--ink-faint); letter-spacing:0.5px; }
  .speed-row button{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.5px;
    padding: 5px 12px; border-radius:999px; border:1px solid var(--stone-line);
    background: transparent; color: var(--ink-dim); cursor:pointer; transition: all .2s ease;
  }
  .speed-row button.active{ background: var(--gold); color:#100E0C; border-color: var(--gold); font-weight:600; }

  .prose{ max-width: 720px; margin-top: 40px; }
  .prose p{ color: var(--ink-dim); font-size:16px; margin-bottom: 20px; }
  .prose p:first-of-type::first-letter{
    font-family:'Fraunces', serif; font-size: 64px; font-weight:500; font-style:italic;
    color: var(--gold-light); float:left; line-height:0.8; margin: 8px 10px 0 0;
  }
  .prose strong{ color: var(--ink); font-weight:600; }
  .sentence{ transition: color .3s ease, background .3s ease; border-radius:3px; }
  .sentence.active{ color: var(--ink); background: rgba(217,188,133,0.14); box-shadow: 0 0 0 3px rgba(217,188,133,0.14); }

  .immersive{ position:relative; height: 72vh; overflow:hidden; }
  .immersive .layer{
    position:absolute; inset:-10%;
    background: var(--img-detail) center 30% / cover no-repeat;
    filter: sepia(0.14) saturate(1.08) contrast(1.05) brightness(0.9);
    will-change: transform;
  }
  .immersive::after{
    content:""; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(16,14,12,0.9) 0%, rgba(16,14,12,0) 16%, rgba(16,14,12,0) 76%, var(--bg) 100%);
  }
  .immersive .cap{
    position:absolute; left:20px; right:20px; bottom:24px; z-index:2;
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase;
    color: var(--gold-light);
  }
  @media (min-width:600px){ .immersive .cap{ left:32px; right:auto; bottom:34px; font-size:11px; letter-spacing:2px; } }

  .timeline{ position:relative; padding-left: 34px; max-width:680px; margin-top:40px; }
  .timeline::before{ content:""; position:absolute; left:5px; top:6px; bottom:6px; width:1px; background: linear-gradient(var(--stone-line), var(--gold-light), var(--stone-line)); }
  .t-item{ position:relative; padding-bottom: 44px; }
  .t-item:last-child{ padding-bottom:0; }
  .t-item::before{ content:""; position:absolute; left:-34px; top:4px; width:11px; height:11px; border-radius:50%; background: var(--bg); border:2px solid var(--gold-light); }
  .t-item .year{ font-family:'IBM Plex Mono', monospace; color: var(--gold-light); font-size:13px; letter-spacing:1px; margin-bottom:6px; }
  .t-item h3{ font-family:'Fraunces', serif; font-weight:500; font-size:22px; color: var(--ink); margin-bottom:8px; }
  .t-item p{ color: var(--ink-dim); font-size:14.5px; max-width:520px; }

  footer{ padding: 44px 0 56px; text-align:center; border-top:1px solid var(--stone-line); }
  footer p{ color: var(--ink-faint); font-size:12.5px; letter-spacing:0.5px; }
  footer .fname{ font-family:'Fraunces', serif; font-style:italic; color: var(--gold-light); font-size:16px; margin-bottom:10px; }

  .load-state{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; color: var(--ink-faint);
    font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:1px; text-align:center; padding:20px;
  }
  .load-state .spin{
    width:28px; height:28px; border-radius:50%; border:2px solid var(--stone-line);
    border-top-color: var(--gold); animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Shown while data.json loads, or if the exhibit id is missing/invalid -->
<div class="load-state" id="loadState">
  <div class="spin"></div>
  <div id="loadMsg">Loading exhibit…</div>
</div>

<!-- Real page — hidden until data.json is loaded, then filled in by JS -->
<div id="page" style="display:none;">

  <header class="site">
    <div class="nav-inner">
      <div class="brand"><b>Napier Museum</b> · Digital Exhibit</div>
      <div class="lang-switch" id="langSwitch">
        <button data-lang="en" class="active">EN</button>
        <button data-lang="ta">TA</button>
        <button data-lang="ml">ML</button>
        <button data-lang="hi">HI</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-content">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="heroTitle"></h1>
      <p class="sub" id="heroSub"></p>
    </div>
    <div class="scroll-cue"><span class="line"></span><span style="font-size:10px;letter-spacing:2px;">SCROLL</span></div>
  </section>

  <div class="label-strip">
    <div class="label-grid">
      <div class="label-cell"><div class="k" id="labelMaterial"></div><div class="v" id="valMaterial"></div></div>
      <div class="label-cell"><div class="k" id="labelPeriod"></div><div class="v" id="valPeriod"></div></div>
      <div class="label-cell"><div class="k" id="labelTradition"></div><div class="v" id="valTradition"></div></div>
      <div class="label-cell"><div class="k" id="labelAccession"></div><div class="v" id="valAccession"></div></div>
    </div>
  </div>

  <section id="listen">
    <div class="container">
      <div class="section-head reveal">
        <span class="tag" id="audioTag"></span>
        <h2 id="audioHeading"></h2>
      </div>
      <div class="audio-panel reveal">
        <button class="playbtn" id="playBtn">▶</button>
        <div class="audio-meta">
          <div class="atitle" id="audioTitle"></div>
          <div class="ahint" id="audioHint"></div>
          <div class="audio-bar"><div class="fill" id="audioFill"></div></div>
        </div>
      </div>
      <div class="speed-row reveal" id="speedRow">
        <span id="speedLabel"></span>
        <button data-rate="0.65">SLOW</button>
        <button data-rate="0.85" class="active">NORMAL</button>
        <button data-rate="1.0">FAST</button>
      </div>
      <div class="audio-note reveal" id="unsupportedNote" style="display:none;">
        <span>Read-aloud isn't supported in this browser. Try Chrome, Edge, or Safari.</span>
      </div>
      <div class="audio-note reveal" id="englishOnlyNote" style="display:none;">
        <span id="englishOnlyNoteText"></span>
      </div>
    </div>
  </section>

  <section id="biography">
    <div class="container">
      <div class="section-head reveal">
        <span class="tag" id="bioTag"></span>
        <h2 id="bioHeading"></h2>
      </div>
      <div class="prose reveal" id="bioProse"><!-- filled by JS --></div>
    </div>
  </section>

  <div class="immersive">
    <div class="layer" id="immersiveLayer"></div>
    <div class="cap" id="detailCap"></div>
  </div>

  <section id="provenance" style="background:var(--bg-2); border-top:1px solid var(--stone-line); border-bottom:1px solid var(--stone-line);">
    <div class="container">
      <div class="section-head reveal">
        <span class="tag" id="provTag"></span>
        <h2 id="provHeading"></h2>
      </div>
      <div class="timeline reveal" id="timelineList"><!-- filled by JS --></div>
    </div>
  </section>

  <footer>
    <div class="fname">Napier Museum</div>
    <p id="footerLine"></p>
  </footer>

</div>

<script>
/* ============================================================
   1) WORK OUT WHICH EXHIBIT TO LOAD
   URL looks like:  template.html?id=vishnu-bronze
   That maps to:    exhibits/vishnu-bronze/data.json
                     exhibits/vishnu-bronze/images/...
============================================================ */
const params = new URLSearchParams(window.location.search);
const exhibitId = params.get('id');
const loadState = document.getElementById('loadState');
const loadMsg = document.getElementById('loadMsg');
const page = document.getElementById('page');

if (!exhibitId) {
  loadMsg.textContent = 'No exhibit specified. Add ?id=exhibit-folder-name to the URL.';
  throw new Error('Missing ?id= parameter');
}

const basePath = `exhibits/${exhibitId}/`;

fetch(basePath + 'data.json')
  .then(res => {
    if (!res.ok) throw new Error('data.json not found for "' + exhibitId + '"');
    return res.json();
  })
  .then(data => {
    renderExhibit(data);
    loadState.style.display = 'none';
    page.style.display = 'block';
    initScrollEffects();
  })
  .catch(err => {
    loadMsg.textContent = "Couldn't load this exhibit (" + exhibitId + "). Check that exhibits/" + exhibitId + "/data.json exists.";
    console.error(err);
  });

/* ============================================================
   2) RENDER — fills the hidden #page skeleton using data.json
============================================================ */
let currentLang = 'en';
let exhibitData = null;

function renderExhibit(data){
  exhibitData = data;

  // Images (paths in data.json are relative to the exhibit's own folder)
  document.documentElement.style.setProperty('--img-hero', `url('${basePath}${data.images.hero}')`);
  document.documentElement.style.setProperty('--img-detail', `url('${basePath}${data.images.detail}')`);

  // Fixed (non-translated) values
  document.getElementById('valMaterial').textContent = data.labels.material;
  document.getElementById('valPeriod').textContent = data.labels.period;
  document.getElementById('valTradition').textContent = data.labels.tradition;
  document.getElementById('valAccession').textContent = data.accession;

  applyLang('en');

  document.getElementById('langSwitch').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-lang]');
    if (!btn) return;
    document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('active', b === btn));
    applyLang(btn.dataset.lang);
  });

  setupReadAloud(data);
}

function applyLang(lang){
  currentLang = lang;
  const t = exhibitData.translations[lang] || exhibitData.translations.en;
  document.getElementById('htmlRoot').setAttribute('lang', lang);
  document.getElementById('pageTitle').textContent = `${t.title} — Napier Museum`;

  document.getElementById('eyebrow').textContent = t.eyebrow;
  document.getElementById('heroTitle').textContent = t.title;
  document.getElementById('heroSub').textContent = t.heroSub;

  document.getElementById('labelMaterial').textContent = t.labelMaterial;
  document.getElementById('labelPeriod').textContent = t.labelPeriod;
  document.getElementById('labelTradition').textContent = t.labelTradition;
  document.getElementById('labelAccession').textContent = t.labelAccession;

  document.getElementById('audioTag').textContent = t.audioTag;
  document.getElementById('audioHeading').textContent = t.audioHeading;
  document.getElementById('audioTitle').textContent = t.audioTitle;
  document.getElementById('audioHint').textContent = t.audioHint;
  document.getElementById('speedLabel').textContent = t.speedLabel;
  document.getElementById('englishOnlyNoteText').textContent = t.englishOnlyNote;

  document.getElementById('bioTag').textContent = t.bioTag;
  document.getElementById('bioHeading').textContent = t.bioHeading;
  renderBiography(lang, t);

  document.getElementById('detailCap').textContent = t.detailCap;
  document.getElementById('provTag').textContent = t.provTag;
  document.getElementById('provHeading').textContent = t.provHeading;
  renderTimeline(lang);

  document.getElementById('footerLine').textContent = t.footerLine;

  // Read-aloud is English-only
  const isEnglish = lang === 'en';
  if (lang !== 'en' && synthAvailable && speechSynthesis.speaking) {
    speechSynthesis.cancel();
    playBtn.textContent = '▶';
    fill.style.width = '0%';
  }
  playBtn.disabled = synthAvailable ? !isEnglish : true;
  document.getElementById('audioHint').style.display = isEnglish ? 'block' : 'none';
  document.getElementById('speedRow').style.display = isEnglish ? 'flex' : 'none';
  document.getElementById('englishOnlyNote').style.display = isEnglish ? 'none' : 'flex';
}

// English shows individually-tagged <span class="sentence"> elements so
// read-aloud can highlight them one by one. Other languages show plain
// paragraphs (bioParagraph1 / bioParagraph2) since there's no audio to sync to.
function renderBiography(lang, t){
  const prose = document.getElementById('bioProse');
  prose.innerHTML = '';

  if (lang === 'en' && exhibitData.readAloud && exhibitData.readAloud.sentences) {
    const sentences = exhibitData.readAloud.sentences;
    const p1 = document.createElement('p');
    const p2 = document.createElement('p');
    sentences.forEach((text, i) => {
      const span = document.createElement('span');
      span.className = 'sentence';
      span.id = 'seg-' + i;
      span.textContent = text + ' ';
      // First ~60% of sentences in paragraph 1, rest in paragraph 2 (matches original design)
      const splitPoint = Math.ceil(sentences.length * 0.6);
      (i < splitPoint ? p1 : p2).appendChild(span);
    });
    prose.appendChild(p1);
    prose.appendChild(p2);
  } else {
    const p1 = document.createElement('p');
    p1.textContent = t.bioParagraph1 || '';
    const p2 = document.createElement('p');
    p2.textContent = t.bioParagraph2 || '';
    prose.appendChild(p1);
    prose.appendChild(p2);
  }
}

function renderTimeline(lang){
  const list = document.getElementById('timelineList');
  list.innerHTML = '';
  (exhibitData.timeline || []).forEach(item => {
    const entry = item[lang] || item.en; // fall back to English if a translation is missing
    const div = document.createElement('div');
    div.className = 't-item';
    div.innerHTML = `
      <div class="year">${item.year}</div>
      <h3>${entry.heading}</h3>
      <p>${entry.text}</p>
    `;
    list.appendChild(div);
  });
}

/* ============================================================
   3) READ-ALOUD (Web Speech API) — English only, no audio file.
   Reads exhibitData.readAloud.sentences, slowly and clearly,
   highlighting each sentence span (#seg-0, #seg-1, ...) as spoken.
============================================================ */
const playBtn = document.getElementById('playBtn');
const fill = document.getElementById('audioFill');
const synthAvailable = 'speechSynthesis' in window;

let rate = 0.85;
let chosenVoice = null;
let fullText = '';
let segments = [];

function pickVoice(){
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  return voices.find(v => v.lang === 'en-IN')
      || voices.find(v => v.lang && v.lang.startsWith('en'))
      || voices[0];
}

function clearHighlight(){
  document.querySelectorAll('.sentence').forEach(s => s.classList.remove('active'));
}

function highlightSegment(id){
  document.querySelectorAll('.sentence').forEach(s => s.classList.toggle('active', s.id === id));
}

function buildUtterance(){
  const u = new SpeechSynthesisUtterance(fullText);
  u.rate = rate;
  u.pitch = 1;
  u.lang = 'en-IN';
  if (chosenVoice) u.voice = chosenVoice;

  u.onboundary = (e) => {
    const idx = e.charIndex !== undefined ? e.charIndex : 0;
    let active = segments[0] ? segments[0].id : null;
    for (const seg of segments) { if (idx >= seg.start) active = seg.id; }
    if (active) highlightSegment(active);
    fill.style.width = Math.min(100, (idx / fullText.length) * 100) + '%';
  };
  u.onend = () => {
    playBtn.textContent = '▶';
    fill.style.width = '100%';
    setTimeout(() => { fill.style.width = '0%'; clearHighlight(); }, 500);
  };
  u.onerror = () => { playBtn.textContent = '▶'; };
  return u;
}

function setupReadAloud(data){
  const sentences = (data.readAloud && data.readAloud.sentences) || [];
  fullText = '';
  segments = [];
  sentences.forEach((text, i) => {
    const start = fullText.length;
    fullText += text;
    segments.push({ id: 'seg-' + i, start });
    if (i < sentences.length - 1) fullText += '  ';
  });

  if (!synthAvailable) {
    playBtn.disabled = true;
    document.getElementById('unsupportedNote').style.display = 'flex';
    return;
  }

  chosenVoice = pickVoice();
  speechSynthesis.onvoiceschanged = () => { chosenVoice = pickVoice(); };

  playBtn.addEventListener('click', () => {
    if (currentLang !== 'en') return;
    if (speechSynthesis.speaking && !speechSynthesis.paused) {
      speechSynthesis.pause();
      playBtn.textContent = '▶';
      return;
    }
    if (speechSynthesis.paused) {
      speechSynthesis.resume();
      playBtn.textContent = '❚❚';
      return;
    }
    speechSynthesis.cancel();
    speechSynthesis.speak(buildUtterance());
    playBtn.textContent = '❚❚';
  });

  document.querySelectorAll('.speed-row button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.speed-row button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      rate = parseFloat(btn.dataset.rate);
      if (speechSynthesis.speaking) {
        speechSynthesis.cancel();
        speechSynthesis.speak(buildUtterance());
        playBtn.textContent = '❚❚';
      }
    });
  });
}

/* ============================================================
   4) Scroll reveal + parallax (same for every exhibit)
============================================================ */
function initScrollEffects(){
  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.15 });
  revealEls.forEach(el => io.observe(el));

  const heroBg = document.getElementById('heroBg');
  const immersiveLayer = document.getElementById('immersiveLayer');
  const immersiveSection = document.querySelector('.immersive');

  function onScroll(){
    const y = window.scrollY;
    if (y < window.innerHeight) heroBg.style.transform = `translateY(${y * 0.18}px) scale(1.06)`;
    const rect = immersiveSection.getBoundingClientRect();
    if (rect.top < window.innerHeight && rect.bottom > 0) {
      const progress = (window.innerHeight - rect.top) / (window.innerHeight + rect.height);
      immersiveLayer.style.transform = `translateY(${(progress - 0.5) * 90}px) scale(1.15)`;
    }
  }
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
}
